name: Check HG680P firmware
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download firmware from Google Drive
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "HG680P Original.rar" \
            "https://drive.usercontent.google.com/download?id=12nZyDKTkeqcTXFNA3O9GEPT1Nk9pO5BV&export=download&authuser=0&confirm=t&uuid=1f84386c-994c-46b6-bf96-9ca67858cbb2"
          ls -lh "HG680P Original.rar"
          head -c 8 "HG680P Original.rar" | od -An -tx1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar fdisk binwalk e2fsprogs squashfs-tools p7zip-full file

      - name: Inspect
        run: |
          set +e
          mkdir -p out
          echo "=== FILE ===" > out/report.txt
          file "HG680P Original.rar" >> out/report.txt 2>&1
          echo "=== RAR LIST ===" >> out/report.txt
          unrar l "HG680P Original.rar" >> out/report.txt 2>&1
          echo "=== EXTRACT ===" >> out/report.txt
          unrar x -o+ "HG680P Original.rar" >> out/report.txt 2>&1
          IMG="HG680P Original/FIRMWARE HG680-P/hg680p-ori.img"
          echo "=== IMG FILE ===" >> out/report.txt
          file "$IMG" >> out/report.txt 2>&1
          echo "=== FDISK ===" >> out/report.txt
          fdisk -l "$IMG" >> out/report.txt 2>&1
          echo "=== BINWALK ===" >> out/report.txt
          binwalk "$IMG" >> out/report.txt 2>&1
          cat out/report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-report
          path: out/report.txt
