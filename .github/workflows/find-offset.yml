name: Find ext4 offset and read build.prop
on:
  workflow_dispatch:

jobs:
  offset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "HG680P Original.rar" \
            "https://drive.usercontent.google.com/download?id=12nZyDKTkeqcTXFNA3O9GEPT1Nk9pO5BV&export=download&authuser=0&confirm=t&uuid=1f84386c-994c-46b6-bf96-9ca67858cbb2"
          ls -lh "HG680P Original.rar"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar e2fsprogs file

      - name: Scan ext4 and dump build.prop via debugfs
        run: |
          set +e
          mkdir -p out
          unrar x -o+ "HG680P Original.rar" > /dev/null 2>&1
          IMG="HG680P Original/FIRMWARE HG680-P/hg680p-ori.img"

          echo "=== SCAN EXT4 SUPERBLOCK ===" > out/final.txt
          python3 scan.py "$IMG" > out/offsets.txt
          cat out/offsets.txt >> out/final.txt

          echo "=== DEBUGFS DIRECT ===" >> out/final.txt
          while read -r OFF VOL; do
            [ -z "$OFF" ] && continue
            echo "--- offset=$OFF vol=$VOL ---" >> out/final.txt
            dd if="$IMG" of="part_$VOL.img" bs=4K \
               iflag=skip_bytes,count_bytes skip="$OFF" count=400M status=none
            echo "--- ls / ---" >> out/final.txt
            debugfs -R "ls /" "part_$VOL.img" 2>&1 | head -40 >> out/final.txt
            echo "--- find build.prop path ---" >> out/final.txt
            for BP in /build.prop /system/build.prop; do
              echo "try $BP" >> out/final.txt
              debugfs -R "cat $BP" "part_$VOL.img" 2>&1 | head -120 >> out/final.txt
            done
          done < out/offsets.txt

          echo "=== TRY MOUNT ===" >> out/final.txt
          while read -r OFF VOL; do
            [ -z "$OFF" ] && continue
            echo "--- mount offset=$OFF vol=$VOL ---" >> out/final.txt
            sudo mkdir -p /mnt/fw
            sudo mount -o loop,ro,offset="$OFF" "$IMG" /mnt/fw 2>&1 | head -5 >> out/final.txt
            RC=${PIPESTATUS[0]}
            echo "rc=$RC" >> out/final.txt
            if [ "$RC" -eq 0 ]; then
              find /mnt/fw -name build.prop -type f 2>/dev/null | while read -r BP; do
                echo "--- $BP ---" >> out/final.txt
                cat "$BP" 2>&1 | head -150 >> out/final.txt
              done
              sudo umount /mnt/fw 2>/dev/null
              break
            fi
          done < out/offsets.txt

          echo "=== DTB MATCH ===" >> out/final.txt
          strings "HG680P Original/FIRMWARE HG680-P/dtb.img" 2>/dev/null \
            | grep -iE 'gxl_p212|p212|s905|hg680|j0lh|622|1g|2g' | head -60 >> out/final.txt

          cat out/final.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: out/final.txt
