name: Find ext4 offset and read build.prop
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  offset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download firmware
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -o "HG680P Original.rar" \
            "https://drive.usercontent.google.com/download?id=12nZyDKTkeqcTXFNA3O9GEPT1Nk9pO5BV&export=download&authuser=0&confirm=t&uuid=1f84386c-994c-46b6-bf96-9ca67858cbb2"
          ls -lh "HG680P Original.rar"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar e2fsprogs file

      - name: Scan ext4 superblock and mount
        run: |
          set +e
          mkdir -p out
          unrar x -o+ "HG680P Original.rar" > /dev/null 2>&1
          IMG="HG680P Original/FIRMWARE HG680-P/hg680p-ori.img"

          echo "=== SCAN EXT4 SUPERBLOCK ===" > out/final.txt
          python3 - "$IMG" > out/offsets.txt <<'PY'
import sys
p = sys.argv[1]
f = open(p, 'rb')
f.seek(0, 2)
size = f.tell()
found = []
pos = 0
chunk = 64 * 1024 * 1024
while pos < size:
    f.seek(pos)
    data = f.read(chunk)
    start = 0
    while True:
        i = data.find(b'\x53\xef', start)
        if i < 0:
            break
        abs_off = pos + i
        if abs_off % 1024 == 0x438 % 1024:
            sb = abs_off - 0x438
            f.seek(sb + 0x480)
            vol = f.read(16).split(b'\x00')[0]
            if vol in (b'system', b'system_ext', b'data', b'cache'):
                found.append((sb, vol.decode(errors='replace')))
        start = i + 1
    pos += chunk
for off, vol in found:
    print(off, vol)
PY
          cat out/offsets.txt >> out/final.txt

          echo "=== TRY MOUNT ===" >> out/final.txt
          OK=0
          while read -r OFF VOL; do
            [ -z "$OFF" ] && continue
            echo "--- try offset=$OFF vol=$VOL ---" >> out/final.txt
            sudo mkdir -p /mnt/fw
            sudo mount -o loop,ro,offset="$OFF" "$IMG" /mnt/fw >> out/final.txt 2>&1
            RC=$?
            echo "rc=$RC" >> out/final.txt
            if [ "$RC" -eq 0 ]; then
              OK=1
              echo "=== ROOT ===" >> out/final.txt
              ls -la /mnt/fw >> out/final.txt 2>&1
              echo "=== FIND BUILD.PROP ===" >> out/final.txt
              find /mnt/fw -name build.prop -type f 2>/dev/null >> out/final.txt
              echo "=== ALL BUILD.PROP ===" >> out/final.txt
              find /mnt/fw -name build.prop -type f 2>/dev/null | while read -r BP; do
                echo "--- $BP ---" >> out/final.txt
                cat "$BP" >> out/final.txt 2>&1
              done
              echo "=== KEY PROPS ===" >> out/final.txt
              grep -hrE 'ro\.(product|build|hardware|board)\.' /mnt/fw --include=build.prop 2>/dev/null \
                | grep -iE 'model|name|device|board|brand|fingerprint|display\.id|incremental|type|tags|date|hardware' \
                >> out/final.txt
              sudo umount /mnt/fw 2>/dev/null
              break
            fi
          done < out/offsets.txt
          echo "mounted=$OK" >> out/final.txt

          echo "=== DTB FULL MATCH ===" >> out/final.txt
          strings "HG680P Original/FIRMWARE HG680-P/dtb.img" 2>/dev/null \
            | grep -iE 'gxl_p212|p212|s905|hg680|j0lh|622|1g|2g' | head -60 >> out/final.txt

          cat out/final.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: out/final.txt
